name: Daily Telegram Counter

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  send-counter:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GIF: ${{ secrets.GIF }}
        run: python bot.py
